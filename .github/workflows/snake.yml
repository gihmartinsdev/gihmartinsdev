name: Atualizar cobrinha de contribuicoes

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: cobrinha
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gihmartinsdev
          outputs: |
            assets/snake.svg?color_snake=#d6a0ac&color_dots=#15261c,#2c4c35,#4e7951,#7bad6b,#b5dd91
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar animacao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualiza cobrinha de contribuicoes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
